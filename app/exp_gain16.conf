# Experiment fragment (2026-09-14): PDM hardware gain +20 dB -> +16 dB on
# Toilet #1 only (cohort "default"). Heartbeats on 2.3.1 showed the mic peaking
# at 0 dBFS with dozens of clip events in every window where the toilet was
# used; the model returns ~0 on clipped audio (see the v2.0.8 tuning notes
# above CONFIG_APP_PDM_GAIN_DB). +12 dB (v2.0.8) killed detection at normal
# distance, so try the midpoint. Toilet #2 stays at +20 dB on the same source
# (2.3.3+0) as the control. Scorecard: audio_clip_count, ww_detections vs
# flush_count, and the mel spectral descriptor rows, per heartbeat.
#
# Built as a distinct image version so Memfault can offer it to one cohort:
#   west build ... -DEXTRA_CONF_FILE="cloud.conf;lowpower.conf;exp_gain16.conf"
CONFIG_APP_PDM_GAIN_DB=16
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="2.3.4+1"
CONFIG_MEMFAULT_NCS_FW_VERSION="2.3.4+1"
