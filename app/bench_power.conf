# BENCH ONLY -- current-measurement overlay for PPK2 work.
# Layered LAST, after the real low-power config:
#   EXTRA_CONF_FILE="cloud.conf;lowpower.conf;bench_power.conf"
#
# NEVER upload a build made with this file to Memfault and never deploy it
# to a cohort. It reconnects every few minutes, which in the field would
# defeat the entire point of the duty cycle and hammer the AP. It exists so
# a full window-plus-sleep cycle can be observed repeatedly on a scope
# instead of once every 12 hours. Wired flash only.

# 5-minute off-time instead of 12 h: a complete cycle (radio on, connect,
# upload, radio off, sleep) every ~5.5 min, so a PPK2 capture catches many
# transitions in one sitting.
CONFIG_APP_CONN_DRAIN_PERIOD_S=300

# Distinct reported version. Without this the bench image reports the SAME
# "2.2.1+0" as the field release, and Memfault only offers an OTA when the
# cohort's active release differs from what the device reports -- so the
# bench unit could NOT be recovered over the air afterwards, it would need
# another wired flash. The suffix makes the two distinguishable, and also
# stops bench heartbeats/coredumps from polluting the real 2.2.1 fleet
# metrics.
CONFIG_MEMFAULT_NCS_FW_VERSION="2.2.1-bench"

# Drive P1.13 high for the whole radio-on region -> PPK2 digital input.
CONFIG_APP_POWER_MARKER=y

# The upload backstop is derived from the DRAIN period
# (UPLOAD_WATCHDOG_DUTY_S = 2 * period + CONNECT_WAIT_S), so at a 300 s
# period it collapses to ~15 min. That is fine and intended: on the bench a
# genuinely wedged upload SHOULD reboot quickly rather than sit there
# silently polluting a capture.

# Heartbeats: back to a short interval so several land per capture and the
# metrics path is exercised. Storage stays at the lowpower.conf value, which
# is enormous for a 5-minute window.
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=600

# NOTE ON SERIAL: logging is deliberately left ENABLED here so the first run
# can be validated against the console (window open/close lines should line
# up with the marker edges). Nordic's DK docs warn that current readings are
# noisy while the virtual serial port is OPEN -- so once the setup is
# confirmed, close the terminal before taking real numbers. For the cleanest
# possible SoC-side figure, rebuild with CONFIG_SERIAL=n, CONFIG_CONSOLE=n,
# CONFIG_LOG=n, CONFIG_PRINTK=n (PLAN_low_power.md step 50). This matters
# far less for the nRF7002 measurement, which is the one that answers
# whether the radio actually powers down.
