# BENCH ONLY -- mel energy descriptor calibration. Layered LAST:
#   EXTRA_CONF_FILE="cloud.conf;lowpower.conf;bench_melcal.conf"
#
# Logs the mel feature values' 1st/99th percentiles since boot every 10 s
# (CONFIG_WW_MEL_CAL), next to the per-second dBFS level (APP_AUDIO_STATS), so
# the readings can be matched to what the room was doing. Take quiet room,
# normal speech at the toilet, the wake word, and a flush, then copy the final
# "since boot" SCALE_P01_MILLI / SCALE_P99_MILLI into prj.conf.
CONFIG_WW_MEL_CAL=y
CONFIG_APP_AUDIO_STATS=y
