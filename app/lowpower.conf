# Low-power overlay (Phase 1: duty-cycled connectivity). Layered AFTER
# cloud.conf: EXTRA_CONF_FILE="cloud.conf;lowpower.conf". See
# PLAN_low_power.md for the roadmap.

# Connectivity in periodic DRAIN windows, radio fully off in between.
CONFIG_APP_CONN_DUTY_CYCLE=y
#
# 12 h off-time (2 windows/day), NOT the 24 h a "daily report" implies.
# Memfault's DeviceOfflineAlert caps incident_start_delay_seconds at 86400
# (the API rejects anything higher with a 400). A healthy unit is silent for
# one full DRAIN period PLUS the window it takes to check in, so at a 24 h
# period there is no threshold that separates "sleeping normally" from
# "dead" -- the alert would page every project member every single day.
# 12 h keeps the proven semantics: the 86400 s alert fires after ~2 missed
# windows. Power cost is negligible (a window is ~30 s of radio, so 2/day
# still captures ~92% of the Wi-Fi savings vs ~96% for 1/day, and the
# always-on audio pipeline dominates either way), and 2 FOTA checks/day
# keeps iteration from becoming a 24 h loop.
# Alert id 21563 is set to 86400 s; see tools/memfault_set_offline_alert.sh.
CONFIG_APP_CONN_DRAIN_PERIOD_S=43200

# Heartbeat interval is forced UP by the long window, not chosen freely.
# Heartbeats keep firing while the radio is off and all of them must sit in
# RAM until the next window drains them. prj.conf's 600 s would accumulate
# 72 per 12 h window; at the ~1 KB/heartbeat the 8 KB/6-heartbeat sizing
# implied, that needs ~72 KB of event storage. The build has ~14 KB of RAM
# headroom (nRF70 data heap 116 KB + mbedTLS heap 82 KB dominate and are not
# safely reclaimable -- the Wi-Fi heap was grown in v2.0.18 to fix
# exhaustion).
#
# 6 h (4/day, so 2 buffered per window) rather than one heartbeat per
# window. Only the daily TOTAL is wanted and time-of-day does not matter, so
# a window-length interval looks right -- but a heartbeat in progress is
# lost on reboot, so one heartbeat per window means any reboot destroys that
# whole window's metrics. That exact failure already bit this project: the
# edge-AI CDR sat at an 86400 s uptime-relative interval until v2.0.13 and
# shipped NOTHING for weeks on units that rebooted before reaching it (see
# prj.conf). 4 buckets/day cap the blast radius at 6 h, still sum to a clean
# daily total in the Memfault dashboard, and cost nothing in storage.
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=21600

# 2 heartbeats per window plus reboot events and CDR chunks fit the original
# 8 KB with wide margin. Overflow silently drops the OLDEST.
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=8192

# Pulse LED1 instead of holding it on for the whole uptime. Held steady, a DK
# LED's ~2 mA is a bigger average draw than the entire connectivity duty cycle
# saves -- on a 900 mAh cell that is weeks of budget spent on an indicator.
# 20 ms every 5 s is 0.4% duty. Belongs in the low-power overlay rather than
# the bench one: it is a real field win, not just trace hygiene.
CONFIG_APP_LED_HEARTBEAT=y
