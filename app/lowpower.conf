# Low-power overlay (Phase 1: duty-cycled connectivity). Layered AFTER
# cloud.conf: EXTRA_CONF_FILE="cloud.conf;lowpower.conf". See
# PLAN_low_power.md for the roadmap.

# Connectivity in periodic DRAIN windows, radio fully off in between.
CONFIG_APP_CONN_DUTY_CYCLE=y
# 1 h off-time between windows (fleet Device Offline alert is set to 2.5 h).
CONFIG_APP_CONN_DRAIN_PERIOD_S=3600

# Heartbeats keep firing every 10 min while offline, so up to ~6 accumulate
# per period (plus reboot events / CDR chunks). The default event storage
# (1 KB) overflows and silently drops the oldest; size for a full period
# with margin.
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=8192
