# Low-power overlay (Phase 1: duty-cycled connectivity). Layered AFTER
# cloud.conf: EXTRA_CONF_FILE="cloud.conf;lowpower.conf". See
# PLAN_low_power.md for the roadmap.

# Connectivity in periodic DRAIN windows, radio fully off in between.
CONFIG_APP_CONN_DUTY_CYCLE=y
# 24 h off-time: one window per day ("daily report from the toilet").
# The fleet Device Offline alert (id 21563) MUST be raised above this or it
# emails everyone every single day -- see PLAN_low_power.md step 4.
CONFIG_APP_CONN_DRAIN_PERIOD_S=86400

# Heartbeat interval is forced UP by the daily window, not chosen freely.
# Heartbeats keep firing while the radio is off and all of them must sit in
# RAM until the next window drains them. prj.conf's 600 s would accumulate
# 144 per day; at the ~1 KB/heartbeat the 8 KB/6-heartbeat sizing implied,
# that needs ~192 KB of event storage. The build has ~14 KB of RAM headroom
# (nRF70 data heap 116 KB + mbedTLS heap 82 KB dominate and are not safely
# reclaimable -- the Wi-Fi heap was grown in v2.0.18 to fix exhaustion).
#
# 6 h (4 heartbeats/day) rather than a single 86400 s daily heartbeat. Only
# the daily TOTAL is wanted and time-of-day does not matter, so 86400 looks
# right -- but a heartbeat in progress is lost on reboot, so one daily
# heartbeat means any reboot destroys a whole day of metrics. That exact
# failure already bit this project: the edge-AI CDR sat at an 86400 s
# uptime-relative interval until v2.0.13 and shipped NOTHING for weeks on
# units that rebooted before reaching it (see prj.conf). 4 buckets/day caps
# the blast radius at 6 h, still sums to a clean daily total in the Memfault
# dashboard, and costs nothing in storage.
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=21600

# 4 heartbeats/day plus reboot events and CDR chunks fit the original 8 KB
# with wide margin. Overflow silently drops the OLDEST, which would eat the
# start of each day.
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=8192
