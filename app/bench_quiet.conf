# BENCH ONLY -- "quiet" overlay for current measurement. Layered LAST:
#   EXTRA_CONF_FILE="cloud.conf;lowpower.conf;bench_power.conf;bench_quiet.conf"
#
# Strips the serial/logging stack so a capture shows what the application
# actually costs rather than what the console costs. PLAN_low_power.md
# step 50 calls for exactly this variant.
#
# MEASURED 2026-07-27: 0.622 mA baseline vs 0.650 mA with serial on, so
# **-28 uA**. Real but small -- ~4% of the SoC baseline and ~2% of the
# whole system budget. NOT promoted to lowpower.conf: this project has
# repeatedly needed the console (the v2.1.0 connect race, the DMIC wedges,
# validating the PPK2 rig), and 2% is a poor trade for losing on-device
# debuggability. Enable it if the budget ever gets tight.
#
# CONFIG_LOG cannot be turned off while Memfault is in -- its Kconfig does
# `select LOG` (ports/zephyr/Kconfig:374). With SERIAL=n the UARTE is gone,
# which is the actual power item; the logging thread survives but its
# output goes nowhere.
#
# There is NO CONSOLE with this build. Correlate against the current trace
# itself (the DRAIN window is unmistakable) or the P1.13 marker, not logs.
#
# NOTE: this does NOT make the SoC reach microamps, and it cannot. The
# wake-word pipeline captures PDM audio and runs inference CONTINUOUSLY by
# design -- the device is never idle. Microamp figures apply to duty-cycled
# sensor nodes that spend their life in System OFF; an always-listening
# device has no such state. What this overlay removes is the UARTE
# peripheral, the logging thread and its buffers.

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
