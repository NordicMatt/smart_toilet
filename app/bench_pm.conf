# ============================================================
# EVALUATED 2026-07-27 AND **NOT ADOPTED**. Kept as a record so
# nobody re-tries this expecting a win.
#
#   bench (serial+log)          0.650 mA baseline
#   + PM_DEVICE_RUNTIME         0.649 mA baseline   <-- no change
#
# It is functionally SAFE -- audio started, DHCP landed at 12.6 s, the
# DRAIN window completed and the audio watchdog never fired, so it does
# not suspend the PDM out from under the pipeline the way
# PLAN_low_power.md feared. It simply saves nothing measurable, because
# the peripherals that dominate here (PDM, and the CPU running inference)
# are the ones actively in use. Risk without reward.
#
# CONFIG_PM (system PM) is NOT AVAILABLE on this SoC: it depends on
# HAS_PM, which nRF54LM20 does not advertise in NCS 3.4.0. Not a loss --
# the idle path is WFI, which is how nRF54L reaches System ON IDLE
# (~3 uA) anyway.
# ============================================================
#
# BENCH ONLY. Layered LAST:
#   EXTRA_CONF_FILE="cloud.conf;lowpower.conf;bench_power.conf;bench_pm.conf"
#
# If ever revisited, re-validate against continuous PDM capture: check
# that audio starts, DRAIN windows still connect, and the audio watchdog
# does not fire.

# System power management: lets the idle thread enter deeper SoC states
# rather than only WFI.
CONFIG_PM=y

# Device power management + runtime PM: allows drivers to suspend
# individually when unused. This is the risky half.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
